<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Sign Up | Scorps Designs</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>

            <div class="logo">
                <a href="home.html">Scorps Designs</a>
            </div>

            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Login / Signup Section -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h1>Welcome to Scorps Designs</h1>

                <p class="auth-intro">
                    Login to your account or create a new one
                    to manage your projects.
                </p>


                <!-- Login Form -->
                <div class="auth-box">

                    <h2>Login</h2>

                    <form action="login.php" method="POST">

                        <label for="login-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >


                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >


                        <button type="submit">
                            Login
                        </button>

                    </form>

                </div>


                <!-- Sign Up Form -->
                <div class="auth-box">

                    <h2>Create Account</h2>

                    <form action="signup.php" method="POST">

                        <label for="signup-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signup-name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >


                        <label for="signup-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signup-email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >


                        <label for="signup-phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="signup-phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >


                        <label for="signup-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signup-password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >


                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                        >


                        <button type="submit">
                            Create Account
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Scorps Designs. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
